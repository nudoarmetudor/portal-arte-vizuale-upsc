<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showcase Web Design - Facultatea de Arte</title>
    <!-- Tailwind CSS pentru styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React și ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel pentru a compila JSX în browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // Componente pentru Iconițe (folosind SVG-uri inline deoarece Lucide-React necesită setup complex în HTML simplu)
        const SearchIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>;
        const FilterIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>;
        const ExternalLinkIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></svg>;
        const CapIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-indigo-600"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>;

        const INITIAL_PROJECTS = [
            {
                id: 1,
                student: "Eugenia Botnari",
                anStudiu: "Anul 2",
                specialitate: "Arte Plastice",
                categorie: "Anime",
                titlu: "Exemplu-de-titlu",
                url: "LINK-PUBLIC-GITHUB",
                imagine: "LINK-IMAGINE",
                tags: ["Prezentare", "Media"]

            },
            {
                id: 2,
                student: "Ionescu Andrei",
                anStudiu: "Anul 3",
                specialitate: "Media Digitală",
                categorie: "Web Interactive",
                titlu: "Explorări Generative",
                url: "https://andrei-i.github.io/generative-art",
                imagine: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&q=80&w=800",
                tags: ["p5.js", "Experimental"]
            },
            {
                id: 3,
                student: "Dumitru Elena",
                anStudiu: "Anul 1",
                specialitate: "Design de Produs",
                categorie: "Portofoliu",
                titlu: "Digital Archive v1",
                url: "https://elena-d.github.io/portfolio",
                imagine: "https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?auto=format&fit=crop&q=80&w=800",
                tags: ["Clean", "Grid System"]
            },
            {
                id: 4,
                student: "Stan Radu",
                anStudiu: "Anul 2",
                specialitate: "Design Grafic",
                categorie: "E-commerce",
                titlu: "Concept Store Muzică",
                url: "https://radu-s.github.io/music-store",
                imagine: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&q=80&w=800",
                tags: ["Typography", "Dark Mode"]
            }
        ];

        function App() {
            const [searchTerm, setSearchTerm] = useState("");
            const [activeFilter, setActiveFilter] = useState({
                anStudiu: "Toți anii",
                specialitate: "Toate specialitățile",
                categorie: "Toate categoriile"
            });

            const filters = useMemo(() => {
                return {
                    ani: ["Toți anii", ...new Set(INITIAL_PROJECTS.map(p => p.anStudiu))],
                    specialitati: ["Toate specialitățile", ...new Set(INITIAL_PROJECTS.map(p => p.specialitate))],
                    categorii: ["Toate categoriile", ...new Set(INITIAL_PROJECTS.map(p => p.categorie))]
                };
            }, []);

            const filteredProjects = INITIAL_PROJECTS.filter(project => {
                const matchesSearch = 
                    project.student.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    project.titlu.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    project.tags.some(t => t.toLowerCase().includes(searchTerm.toLowerCase()));
                
                const matchesAn = activeFilter.anStudiu === "Toți anii" || project.anStudiu === activeFilter.anStudiu;
                const matchesSpec = activeFilter.specialitate === "Toate specialitățile" || project.specialitate === activeFilter.specialitate;
                const matchesCat = activeFilter.categorie === "Toate categoriile" || project.categorie === activeFilter.categorie;

                return matchesSearch && matchesAn && matchesSpec && matchesCat;
            });

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-white border-b sticky top-0 z-10 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 py-6">
                            <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                                <div>
                                    <h1 className="text-2xl font-bold text-gray-900 flex items-center gap-2">
                                        <CapIcon />
                                        Showcase Web Design
                                    </h1>
                                    <p className="text-gray-500 text-sm mt-1">Facultatea de Arte Vizuale și Design</p>
                                </div>
                                
                                <div className="relative">
                                    <div className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                                        <SearchIcon />
                                    </div>
                                    <input 
                                        type="text"
                                        placeholder="Caută student sau proiect..."
                                        className="pl-10 pr-4 py-2 border border-gray-200 rounded-lg w-full md:w-80 focus:ring-2 focus:ring-indigo-500 outline-none transition-all"
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                    />
                                </div>
                            </div>

                            <div className="mt-6 flex flex-wrap gap-3 items-center">
                                <div className="flex items-center gap-2 text-gray-400 text-xs font-bold uppercase tracking-wider">
                                    <FilterIcon /> Filtre:
                                </div>
                                <select 
                                    className="bg-gray-100 text-sm px-3 py-2 rounded-md border-none focus:ring-2 focus:ring-indigo-500 cursor-pointer"
                                    value={activeFilter.anStudiu}
                                    onChange={(e) => setActiveFilter({...activeFilter, anStudiu: e.target.value})}
                                >
                                    {filters.ani.map(an => <option key={an} value={an}>{an}</option>)}
                                </select>
                                <select 
                                    className="bg-gray-100 text-sm px-3 py-2 rounded-md border-none focus:ring-2 focus:ring-indigo-500 cursor-pointer"
                                    value={activeFilter.specialitate}
                                    onChange={(e) => setActiveFilter({...activeFilter, specialitate: e.target.value})}
                                >
                                    {filters.specialitati.map(sp => <option key={sp} value={sp}>{sp}</option>)}
                                </select>
                                <select 
                                    className="bg-gray-100 text-sm px-3 py-2 rounded-md border-none focus:ring-2 focus:ring-indigo-500 cursor-pointer"
                                    value={activeFilter.categorie}
                                    onChange={(e) => setActiveFilter({...activeFilter, categorie: e.target.value})}
                                >
                                    {filters.categorii.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                                </select>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
                        <div className="mb-6">
                            <h2 className="text-lg font-medium text-gray-600">
                                {filteredProjects.length} proiecte găsite
                            </h2>
                        </div>

                        {filteredProjects.length > 0 ? (
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                                {filteredProjects.map((project) => (
                                    <div key={project.id} className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition-shadow flex flex-col">
                                        <div className="relative aspect-video group">
                                            <img 
                                                src={project.imagine} 
                                                className="w-full h-full object-cover"
                                                alt={project.titlu}
                                            />
                                            <div className="absolute inset-0 bg-indigo-900/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                                <a href={project.url} target="_blank" className="bg-white text-gray-900 px-4 py-2 rounded-full text-sm font-bold flex items-center gap-2">
                                                    Vezi Proiect <ExternalLinkIcon />
                                                </a>
                                            </div>
                                        </div>
                                        <div className="p-4 flex flex-col flex-grow">
                                            <span className="text-[10px] font-bold text-indigo-600 uppercase mb-1">{project.categorie}</span>
                                            <h3 className="font-bold text-gray-900 mb-2 leading-tight">{project.titlu}</h3>
                                            <div className="text-xs text-gray-500 mt-auto">
                                                <p className="font-semibold text-gray-700">{project.student}</p>
                                                <p>{project.anStudiu} • {project.specialitate}</p>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="text-center py-20">
                                <p className="text-gray-400">Nu am găsit niciun proiect care să corespundă filtrelor tale.</p>
                            </div>
                        )}
                    </main>

                    <footer className="bg-white border-t py-8 text-center text-gray-400 text-xs">
                        &copy; {new Date().getFullYear()} Facultatea de Arte Vizuale și Design - UPSC
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
